services:
  db:
    networks:
      - app-network
    image: postgres:15
    container_name: postgres_db_task
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: ["postgres", "-c", "port=5431"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  task-service:
    networks:
      - app-network
    build:
      context: .
      args:
        MAVEN_SKIP_TESTS: true
    ports:
      - "4004:4004"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - jwt.secret=${SECRET}
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge