services:
  project-db:
    networks:
      - app-network
    image: postgres:15
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: ["postgres", "-c", "port=${DB_PORT}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  project-service:
    networks:
      - app-network
    build:
      context: .
      args:
        MAVEN_SKIP_TESTS: true
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_CONTAINER_NAME=${DB_CONTAINER_NAME}
      - jwt.secret=${SECRET}
    depends_on:
      - project-db

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge